<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Washon Capital</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e2e0f0;
    }

    #bg-canvas {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      backdrop-filter: blur(12px);
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 1.75rem;
    }
    .logo-row img { height: 36px; }
    .logo-row span {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -.02em;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: .4rem;
    }
    .sub {
      font-size: .875rem;
      color: #8b87b8;
      margin-bottom: 1.75rem;
    }
    .sub a { color: #9d8fff; text-decoration: none; }
    .sub a:hover { text-decoration: underline; }

    .alerts { margin-bottom: 1rem; }
    .alert {
      padding: .7rem 1rem;
      border-radius: 8px;
      font-size: .875rem;
      margin-bottom: .5rem;
    }
    .alert-danger  { background: rgba(239,68,68,.15);  border: 1px solid rgba(239,68,68,.3);  color: #fca5a5; }
    .alert-success { background: rgba(34,197,94,.12);  border: 1px solid rgba(34,197,94,.25); color: #86efac; }
    .alert-info    { background: rgba(99,102,241,.12); border: 1px solid rgba(99,102,241,.3); color: #a5b4fc; }

    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: #9d9ab8;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: .4rem;
    }
    input[type=email], input[type=password], input[type=text] {
      width: 100%;
      padding: .7rem 1rem;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      color: #e2e0f0;
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 1.1rem;
    }
    input:focus { border-color: #7c6fff; }

    .check-row {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .875rem;
      color: #8b87b8;
      margin-bottom: 1.4rem;
    }
    .check-row input[type=checkbox] { accent-color: #7c6fff; }

    .btn {
      width: 100%;
      padding: .8rem;
      background: linear-gradient(135deg, #6d5fff, #9d6bff);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    .btn:hover  { opacity: .9; }
    .btn:active { transform: scale(.98); }
  </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
  <div class="card">
    <div class="logo-row">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Washon">
      <span>Washon Capital</span>
    </div>

    <h1>Welcome back</h1>
    <p class="sub">Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="alerts">
          {% for cat, msg in messages %}
            <div class="alert alert-{{ cat }}">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>

      <div class="check-row">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember" style="text-transform:none;font-size:.875rem;color:#8b87b8;letter-spacing:0;margin:0;">
          Remember me
        </label>
      </div>

      <button type="submit" class="btn">Sign In</button>
    </form>
  </div>
<script>
(function () {
  const canvas = document.getElementById('bg-canvas');
  const ctx    = canvas.getContext('2d');
  const TAU    = Math.PI * 2;

  const COUNT     = 120;
  const MAXD      = 145;
  const MAXDSQ    = MAXD * MAXD;
  const D1SQ      = MAXDSQ * .11;
  const D2SQ      = MAXDSQ * .44;
  const BEAM_N    = 6;
  const MOUSE_R   = 160;
  const MOUSE_RSQ = MOUSE_R * MOUSE_R;

  let W, H, pts, beams;
  let mx = -9999, my = -9999;

  const rnd = (a, b) => a + Math.random() * (b - a);

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function mkPt() {
    const bvx = rnd(.08, .3) * (Math.random() < .5 ? 1 : -1);
    const bvy = rnd(.08, .3) * (Math.random() < .5 ? 1 : -1);
    return { x: rnd(0, W), y: rnd(0, H), vx: bvx, vy: bvy, bvx, bvy,
             r: rnd(1, 3.5), hue: rnd(220, 285), dh: rnd(-4, 4),
             ph: rnd(0, TAU), alp: rnd(.32, .68) };
  }

  function mkBeam() {
    return { x: rnd(-W * .5, W * 1.5), ang: rnd(28, 55) * Math.PI / 180,
             speed: rnd(.04, .13), w: rnd(1, 2.8), alp: rnd(.025, .06) };
  }

  function init() {
    resize();
    pts   = Array.from({ length: COUNT }, mkPt);
    beams = Array.from({ length: BEAM_N }, mkBeam);
  }

  function frame(ts) {
    ctx.clearRect(0, 0, W, H);
    const t = ts * .001;
    const gPulse = .5 + Math.sin(t) * .5;

    for (const b of beams) {
      b.x += b.speed;
      if (b.x > W * 1.5) b.x = -W * .5;
      const dx = H * Math.tan(b.ang);
      const x0 = b.x, y0 = -60, x1 = b.x + dx, y1 = H + 60;
      const g = ctx.createLinearGradient(x0, y0, x1, y1);
      g.addColorStop(0,   'rgba(170,150,255,0)');
      g.addColorStop(.18, `rgba(170,150,255,${b.alp})`);
      g.addColorStop(.82, `rgba(170,150,255,${b.alp})`);
      g.addColorStop(1,   'rgba(170,150,255,0)');
      ctx.lineWidth = b.w; ctx.strokeStyle = g;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }

    for (const p of pts) {
      const ex = p.x - mx, ey = p.y - my;
      const ed = ex * ex + ey * ey;
      if (ed < MOUSE_RSQ && ed > 1) {
        const em = Math.sqrt(ed), push = (1 - em / MOUSE_R) * .7;
        p.vx += (ex / em) * push * .05;
        p.vy += (ey / em) * push * .05;
      }
      p.vx = p.vx * .94 + p.bvx * .06;
      p.vy = p.vy * .94 + p.bvy * .06;
      const spd = p.vx * p.vx + p.vy * p.vy;
      if (spd > 4) { const s = 2 / Math.sqrt(spd); p.vx *= s; p.vy *= s; }
      p.x += p.vx; p.y += p.vy;
      p.hue = (p.hue + p.dh * .016 + 360) % 360;
      if (p.x <= 0) { p.x = 0; p.vx = Math.abs(p.vx); p.bvx = Math.abs(p.bvx); }
      if (p.x >= W) { p.x = W; p.vx = -Math.abs(p.vx); p.bvx = -Math.abs(p.bvx); }
      if (p.y <= 0) { p.y = 0; p.vy = Math.abs(p.vy); p.bvy = Math.abs(p.bvy); }
      if (p.y >= H) { p.y = H; p.vy = -Math.abs(p.vy); p.bvy = -Math.abs(p.bvy); }
    }

    const lA = [
      (.30 + gPulse * .09).toFixed(3),
      (.13 + gPulse * .04).toFixed(3),
      (.05 + gPulse * .01).toFixed(3),
    ];
    const near = new Path2D(), mid = new Path2D(), far = new Path2D();
    const bkts = [near, mid, far];
    for (let i = 0; i < COUNT; i++) {
      for (let j = i + 1; j < COUNT; j++) {
        const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
        const d2 = dx * dx + dy * dy;
        if (d2 >= MAXDSQ) continue;
        const bk = d2 < D1SQ ? 0 : d2 < D2SQ ? 1 : 2;
        bkts[bk].moveTo(pts[i].x, pts[i].y);
        bkts[bk].lineTo(pts[j].x, pts[j].y);
      }
    }
    ctx.lineWidth = .7;
    ctx.strokeStyle = `rgba(130,118,255,${lA[0]})`; ctx.stroke(near);
    ctx.strokeStyle = `rgba(130,118,255,${lA[1]})`; ctx.stroke(mid);
    ctx.strokeStyle = `rgba(130,118,255,${lA[2]})`; ctx.stroke(far);

    ctx.shadowBlur = 8;
    for (const p of pts) {
      const pr = Math.max(.5, p.r + Math.sin(t * .9 + p.ph) * p.r * .28);
      const a  = (p.alp * (.80 + gPulse * .20)).toFixed(3);
      const h  = p.hue | 0;
      ctx.shadowColor = `hsla(${h},85%,68%,.5)`;
      ctx.fillStyle   = `hsla(${h},72%,82%,${a})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, pr, 0, TAU); ctx.fill();
    }
    ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize',     resize);
  window.addEventListener('mousemove',  e => { mx = e.clientX; my = e.clientY; });
  window.addEventListener('mouseleave', () => { mx = -9999; my = -9999; });

  init();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
